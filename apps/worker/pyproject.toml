[project]
name = "origin-worker"
version = "0.1.0"
description = "ORIGIN pipeline worker (arq)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "origin-core",
    "arq>=0.26",
]

[tool.uv.sources]
origin-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
