[project]
name = "origin-workspace"
version = "0.1.0"
description = "ORIGIN image provenance tracer: uv workspace root"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/shared", "apps/api", "apps/worker"]

[tool.uv.sources]
origin-core = { workspace = true }
origin-api = { workspace = true }
origin-worker = { workspace = true }

[dependency-groups]
dev = [
    "origin-core",
    "origin-api",
    "origin-worker",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/shared/src", "apps/api/src", "apps/worker/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PTH", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108"]
"**/migrations/**" = ["E501"]

[tool.pyright]
include = ["conftest.py", "packages/shared/src", "apps/api/src", "apps/worker/src", "packages/shared/tests", "apps/api/tests", "apps/worker/tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages/shared/tests", "apps/api/tests", "apps/worker/tests"]
markers = ["db: needs Postgres (TEST_DATABASE_URL)", "redis: needs Redis (TEST_REDIS_URL)", "s3: needs an S3 endpoint (TEST_S3_ENDPOINT)"]
